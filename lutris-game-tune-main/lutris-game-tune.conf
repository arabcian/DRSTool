# /etc/lutris-game-tune.conf — written by DRSTool
# Generated: 2026-09-19 09:27:51
#
# This file is read by lutris-game-tune.sh (whitelist-only KEY=VALUE parser).
# Must be owned by root and not group/other writable (mode 644 or 640).
# Changes take effect on the next PRE run.

# --- CPU Governor / EPP -------------------------------------------
SET_CPU_GOVERNOR=1
CPU_GOVERNOR=powersave

# amd-pstate per-core EPP boost (kernel module parameter; only present
# on kernels built with the epp_boost patch series — skipped silently
# otherwise). 1=on, 0=off.
SET_EPP_BOOST=1

# AMD 3D V-Cache core preference (amd_x3d_vcache driver; AMD 3D
# V-Cache CPUs only). frequency = prefer higher-clocking CCD,
# cache = prefer cores on the CCD with the larger L3. Skipped
# silently if the driver isn't bound.
SET_X3D_VCACHE_MODE=1
X3D_VCACHE_MODE=cache

# --- PCIe ASPM ---------------------------------------------------
SET_ASPM=1
ASPM_POLICY=performance

# --- Deep C-state disabling (optional) ---------------------------
DISABLE_DEEP_CSTATES=0
CSTATE_KEEP_MAX=1

# --- VM ----------------------------------------------------------
VM_SWAPPINESS=10

# --- Transparent HugePages ---------------------------------------
THP_ENABLED=never
THP_SHMEM_ENABLED=never
THP_DEFRAG=never

# --- CCD/CCX core isolation ---------------------------------------
CCD_ISOLATION_ENABLED=1
CCD_LAUNCHER=lutris
CCD_EXTRA_GOOD_PROCS="wine wineserver wine64-preloader proton gamescope"
CCD_MONITOR_SECONDS=30
CCD_GOOD_PARTITION_TYPE=isolated
CCD_UGLY_PARTITION_TYPE=member
CCD_PROTECTED_PROCS=elogind elogind-daemon systemd-logind dbus-daemon dbus-broker polkitd openrc-user login gdm gdm3 sddm lightdm

# --- PCI latency -------------------------------------------------
SET_PCI_LATENCY=1

# --- Logging -----------------------------------------------------
LOG_LEVEL=WARN

# pip / pipx install of the DRSTool GUI and its drstool_core package.
#
#   pipx install git+https://github.com/arabcian/DRSTool
#   pip install --user .
#
# The vk_flip_meter and lutris-game-tune sources are installed as data under
# <prefix>/share/drstool/ so the GUI can still build / install them (both need
# root for the final step and ask through pkexec). Distribution packages
# (ebuild, PKGBUILD) build those two components themselves instead.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drstool"
version = "2026.10.23"
description = "dxvk-nvapi / NVIDIA DRS profile editor with Proton, DXVK, VKD3D and gamescope tooling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "arabcian" }]
dependencies = [
    "PySide6>=6.5",
    "PyYAML>=6",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
# Makes KDE/Wayland show the right taskbar icon (renames the process to "drstool")
proctitle = ["setproctitle"]

[project.urls]
Homepage = "https://github.com/arabcian/DRSTool"

[project.scripts]
drstool = "DRSTool:main"

[tool.setuptools]
py-modules = ["DRSTool"]
packages = ["drstool_core"]
include-package-data = false

[tool.setuptools.data-files]
"share/applications" = ["data/drstool.desktop"]
"share/icons/hicolor/512x512/apps" = ["assets/drstool.png"]
"share/drstool/vk-flip-meter-main" = [
    "vk-flip-meter-main/CMakeLists.txt",
    "vk-flip-meter-main/build.sh",
    "vk-flip-meter-main/LICENSE",
    "vk-flip-meter-main/README.md",
]
"share/drstool/vk-flip-meter-main/src" = ["vk-flip-meter-main/src/flip_meter.cpp"]
"share/drstool/vk-flip-meter-main/manifest" = ["vk-flip-meter-main/manifest/VkLayer_cpu_flip_meter.json.in"]
"share/drstool/lutris-game-tune-main" = [
    "lutris-game-tune-main/install.sh",
    "lutris-game-tune-main/uninstall.sh",
    "lutris-game-tune-main/lutris-game-tune.sh",
    "lutris-game-tune-main/lutris-game-tune-wrapper.c",
    "lutris-game-tune-main/lutris-game-tune.conf",
    "lutris-game-tune-main/lutris-game-tune.conf.example",
    "lutris-game-tune-main/org.drstool.lutris-game-tune.policy",
    "lutris-game-tune-main/LICENSE",
    "lutris-game-tune-main/README.md",
]
"share/drstool/lutris-game-tune-main/profiles" = ["lutris-game-tune-main/profiles/heavy-game.conf.example"]

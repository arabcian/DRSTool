name: Source quality checks
on:
  push:
  pull_request:
jobs:
  python-and-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for GUI tests
        run: python -m pip install 'PySide6>=6.5' 'PyYAML>=6' 'ruamel.yaml>=0.18' ruff
      - name: Source compilation
        run: python -m compileall -q drstool_core drstool_gui tests
      - name: All tests (GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Static lint (fatal errors)
        run: ruff check .
      - name: Bash tuning tests
        run: bash lutris-game-tune-main/tests/run-tests.sh
  flm-sanitizer-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan layer headers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Compile each sanitizer mode
        run: scripts/test-flm-sanitizers.sh
